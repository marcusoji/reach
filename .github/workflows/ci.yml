name: REACH CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reach-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: reach-platform/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:hardening
      - run: npm run test:security
      - run: npm run test:ai
      - run: npm run test:relay
      - run: npm run test:pwa-relay
      - run: npm run test:pwa-relay-permissions
      - run: npm run test:pwa-relay-status
      - run: npm run test:pwa-history
      - run: npm run test:pwa-api-resilience
      - run: npm run test:rpc-contract
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:providers
      - run: npm run build
        env:
          VITE_REACH_DEMO_MODE: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'public-anon-placeholder' }}

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check PWA JS
        run: |
          for f in reach-citizen-pwa/js/*.js reach-citizen-pwa/js/relay/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Relay protocol tests
        run: node reach-citizen-pwa/js/relay/test-protocol.mjs
      - name: Evidence capture tests
        run: node reach-platform/scripts/tests/pwa-evidence-capture.mjs

  sql-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reach-platform
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Check migration order
        run: |
          ls supabase/migrations/*.sql | sort
          test -f supabase/migrations/0001_reach_mvp.sql
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply every migration against Postgres+PostGIS
        run: npm run validate:migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Relay ingest + dedup concurrency simulation
        run: npm run test:relay-sim
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-node-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug lint testDebugUnitTest --stacktrace

  security-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run static security checks
        run: node reach-platform/scripts/tests/security-static.mjs
