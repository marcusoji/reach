name: Clear demo data

# Manual only. Deletes every REACH data record from the hosted database (schema and the
# two canonical ai_model_registry rows are kept). It is destructive and irreversible: run
# it deliberately, against the intended project, and never on a project holding real data.
on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clear all data from the hosted database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "SUPABASE_ACCESS_TOKEN secret is not set"; exit 1; fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then echo "SUPABASE_PROJECT_ID secret is not set"; exit 1; fi
          jq -Rs '{query: .}' reach-platform/scripts/clear-demo-data.sql > /tmp/clear-body.json
          code=$(curl -sS -o /tmp/clear-out.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/clear-body.json)
          echo "Management API HTTP ${code}"
          cat /tmp/clear-out.json
          case "$code" in
            200|201) echo "Data cleared." ;;
            *) echo "Clear failed."; exit 1 ;;
          esac
