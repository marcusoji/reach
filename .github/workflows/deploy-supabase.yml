name: Deploy Supabase API

on:
  push:
    branches:
      - main
    paths:
      - 'reach-platform/supabase/**'
      - '.github/workflows/deploy-supabase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reach-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin the CLI instead of resolving "latest": a transient GitHub API error resolving
      # "latest" fails the whole deploy before any step runs.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The browser calls the Edge API cross-origin, so a missing or wrong
      # REACH_ALLOWED_ORIGINS makes every request fail with an opaque "Failed to fetch".
      # Prefer the repo secret so real deployments control their own allow-list, but fall back
      # to the hosted dev/preview origins *and the deployed frontends* so a missing secret
      # cannot leave the API refusing every browser request. Trim the fallback for a real
      # production deployment.
      - name: Configure API CORS allow-list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CONFIGURED_ORIGINS: ${{ secrets.REACH_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          default_origins="http://localhost:5173,http://localhost:5500,http://localhost:3000,https://*.prod-runtime.all-hands.dev,https://reach-web-mu.vercel.app,https://reach-citizen.vercel.app,https://reach-*-marcus-projects-c5af6f00.vercel.app"
          origins="${CONFIGURED_ORIGINS:-$default_origins}"
          echo "Setting REACH_ALLOWED_ORIGINS for the API."
          supabase secrets set REACH_ALLOWED_ORIGINS="$origins" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      # Link the Helix (Launchverse) second-opinion provider. All three secrets must be present;
      # if any is missing this step is a no-op so the deterministic engine keeps running alone
      # rather than the provider being half-configured. Add them with:
      #   gh secret set REACH_AI_ENDPOINT --body https://api.launchverse.app/api/v1/chat/completions
      #   gh secret set REACH_AI_API_KEY  --body helix_...
      #   gh secret set REACH_AI_MODEL    --body helix-advisor
      # The key is a server-side secret only: never a VITE_ variable and never in config.js.
      - name: Link AI provider (optional)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AI_ENDPOINT: ${{ secrets.REACH_AI_ENDPOINT }}
          AI_KEY: ${{ secrets.REACH_AI_API_KEY }}
          AI_MODEL: ${{ secrets.REACH_AI_MODEL }}
          AI_THRESHOLD: ${{ secrets.REACH_AI_BREAKER_THRESHOLD }}
        run: |
          set -euo pipefail
          if [ -z "${AI_ENDPOINT:-}" ] || [ -z "${AI_KEY:-}" ] || [ -z "${AI_MODEL:-}" ]; then
            echo "REACH_AI_* secrets are not all set; leaving the AI provider unconfigured (deterministic engine only)."
            exit 0
          fi
          args=(REACH_AI_ENDPOINT="$AI_ENDPOINT" REACH_AI_API_KEY="$AI_KEY" REACH_AI_MODEL="$AI_MODEL")
          if [ -n "${AI_THRESHOLD:-}" ]; then args+=(REACH_AI_BREAKER_THRESHOLD="$AI_THRESHOLD"); fi
          echo "Linking AI provider $AI_MODEL at $AI_ENDPOINT."
          supabase secrets set "${args[@]}" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy API Edge Function
        run: supabase functions deploy api --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
