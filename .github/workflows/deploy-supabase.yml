name: Deploy Supabase API

on:
  push:
    branches:
      - main
    paths:
      - 'reach-platform/supabase/**'
      - '.github/workflows/deploy-supabase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reach-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The browser calls the Edge API cross-origin, so a missing or wrong
      # REACH_ALLOWED_ORIGINS makes every request fail with an opaque "Failed to fetch".
      # Prefer the repo secret so real deployments control their own allow-list, but fall back
      # to the hosted dev/preview origins so a missing secret cannot leave the API refusing
      # every browser request. Trim the fallback for a real production deployment.
      - name: Configure API CORS allow-list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CONFIGURED_ORIGINS: ${{ secrets.REACH_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          default_origins="http://localhost:5173,http://localhost:5500,https://*.prod-runtime.all-hands.dev"
          origins="${CONFIGURED_ORIGINS:-$default_origins}"
          echo "Setting REACH_ALLOWED_ORIGINS for the API."
          supabase secrets set REACH_ALLOWED_ORIGINS="$origins" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy API Edge Function
        run: supabase functions deploy api --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
