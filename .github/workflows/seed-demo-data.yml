name: Seed demo data

# Manual only. Clears every REACH data record and inserts one representative row per
# table, so each screen has something to show. It is destructive: run it deliberately,
# against the intended demo project, and never on a project holding real data.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply reset + demo seed to the hosted database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "SUPABASE_ACCESS_TOKEN secret is not set"; exit 1; fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then echo "SUPABASE_PROJECT_ID secret is not set"; exit 1; fi
          jq -Rs '{query: .}' reach-platform/scripts/seed-demo-data.sql > /tmp/seed-body.json
          code=$(curl -sS -o /tmp/seed-out.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/seed-body.json)
          echo "Management API HTTP ${code}"
          cat /tmp/seed-out.json
          case "$code" in
            200|201) echo "Seed applied." ;;
            *) echo "Seed failed."; exit 1 ;;
          esac
